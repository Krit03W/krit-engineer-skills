<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc">
  <title id="title">krit-engineer-skills</title>
  <desc id="desc">An engineering flow for shipping real products with AI coding agents: grill-with-docs, to-spec, to-tickets, implement, code-review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#141a38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>

  <clipPath id="card"><rect width="1280" height="450" rx="20"/></clipPath>
  <g clip-path="url(#card)">
    <rect width="1280" height="450" fill="url(#bg)"/>
    <rect width="1280" height="450" fill="url(#grid)"/>
    <circle cx="1120" cy="40" r="170" fill="#8b5cf6" opacity="0.28" filter="url(#blur)"/>
    <circle cx="150" cy="400" r="160" fill="#06b6d4" opacity="0.22" filter="url(#blur)"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="142" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#f8fafc"><tspan fill="url(#accent)">krit</tspan>-engineer-skills</text>
    <text x="640" y="192" font-size="24" fill="#a5b4d4">From idea to filed issues to reviewed code — with AI coding agents.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <g font-size="14" fill="#64748b" letter-spacing="1">
      <text x="250" y="254">01 · INTERVIEW</text>
      <text x="466" y="254">02 · SPEC</text>
      <text x="652" y="254">03 · ISSUES</text>
      <text x="850" y="254">04 · BUILD</text>
      <text x="1054" y="254">05 · REVIEW</text>
    </g>

    <g fill="#ffffff" fill-opacity="0.04" stroke-width="2">
      <rect x="140" y="268" width="220" height="52" rx="26" stroke="#a78bfa"/>
      <rect x="404" y="268" width="124" height="52" rx="26" stroke="#818cf8"/>
      <rect x="572" y="268" width="160" height="52" rx="26" stroke="#60a5fa"/>
      <rect x="776" y="268" width="148" height="52" rx="26" stroke="#38bdf8"/>
      <rect x="968" y="268" width="172" height="52" rx="26" stroke="#22d3ee"/>
    </g>

    <g font-size="20" font-weight="600" fill="#e2e8f0">
      <text x="250" y="301">grill-with-docs</text>
      <text x="466" y="301">to-spec</text>
      <text x="652" y="301">to-tickets</text>
      <text x="850" y="301">implement</text>
      <text x="1054" y="301">code-review</text>
    </g>

    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <line x1="366" y1="294" x2="396" y2="294"/>
      <line x1="534" y1="294" x2="564" y2="294"/>
      <line x1="738" y1="294" x2="768" y2="294"/>
      <line x1="930" y1="294" x2="960" y2="294"/>
    </g>

    <text x="456" y="366" font-size="14" fill="#34d399" letter-spacing="1">+ SECURITY</text>
    <g fill="#34d399" fill-opacity="0.06" stroke="#34d399" stroke-width="1.5">
      <rect x="525" y="344" width="166" height="34" rx="17"/>
      <rect x="703" y="344" width="176" height="34" rx="17"/>
    </g>
    <g font-size="16" font-weight="600" fill="#d1fae5">
      <text x="608" y="367">security-audit</text>
      <text x="791" y="367">skill-inspector</text>
    </g>

    <text x="640" y="420" font-size="16" fill="#64748b">18 plain SKILL.md files  ·  Claude Code  ·  Codex  ·  Cursor  ·  Copilot</text>
  </g>
</svg>
